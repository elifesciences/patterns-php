name: CI Pipeline

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make PHP_VERSION=${{ matrix.php_version }} test-ci
  
  linting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Run linting
        run: make PHP_VERSION=${{ matrix.php_version }} lint-ci
