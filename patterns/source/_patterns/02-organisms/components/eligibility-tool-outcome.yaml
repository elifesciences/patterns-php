$schema: http://json-schema.org/draft-04/schema#
type: object
properties:
  type:
    type: string
    enum:
      - agreed
      - agreed-hhmi
      - not-agreed-published
      - not-agreed-not-published
  isAgreed:
    type: boolean
  isAgreedHhmi:
    type: boolean
  isNotAgreedPublished:
    type: boolean
  isNotAgreedNotPublished:
    type: boolean
  hasPossibleMatches:
    type: boolean
  possibleMatches:
    type: array
required:
  - type
