$schema: http://json-schema.org/draft-04/schema#
type: object
properties:
  type:
    type: string
    enum:
      - agreed
      - not-agreed-published
      - not-agreed-not-published
      - not-agreed-not-published-with-possible-matches
  isAgreed:
    type: boolean
  isNotAgreedPublished:
    type: boolean
  isNotAgreedUnpublished:
    type: boolean
  possibleMatches:
    type: array
required:
  - type
