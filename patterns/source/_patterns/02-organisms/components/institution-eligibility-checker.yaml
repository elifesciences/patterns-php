$schema: http://json-schema.org/draft-04/schema#
type: object
properties:
  formId:
    type: string
  label:
    type: string
    minLength: 1
  inputName:
    type: string
    minLength: 1
  inputValue:
    type: string
  inputPlaceholder:
    type: string
  ctaText:
    type: string
  searchUrl:
    type: string
required:
  - formId
  - label
  - inputName
  - inputPlaceholder
  - ctaText
  - searchUrl