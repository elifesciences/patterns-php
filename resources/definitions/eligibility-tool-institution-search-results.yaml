$schema: 'http://json-schema.org/draft-04/schema#'
type: object
properties:
    institutions:
        type: array
        items:
            $schema: 'http://json-schema.org/draft-04/schema#'
            type: object
            properties:
                name:
                    type: string
                    minLength: 1
                url:
                    type: string
                    minLength: 1
                ariaLabel:
                    type: string
                    minLength: 1
                isCurrent:
                    type: boolean
                    default: false
            required:
                - name
                - url
    emptyMessage:
        type: string
        minLength: 1
