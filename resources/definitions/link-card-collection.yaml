$schema: 'http://json-schema.org/draft-04/schema#'
type: object
properties:
    linkCards:
        type: array
        minItems: 1
        items:
            $schema: 'http://json-schema.org/draft-04/schema#'
            type: object
            properties:
                link:
                    type: object
                body:
                    type: string
            required:
                - link
                - body
required:
    - linkCards
